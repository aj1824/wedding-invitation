<!doctype html>
<html><head><meta charset="utf-8"><title>render art</title></head>
<body>
<script src="art.js"></script>
<script>
  // Rasterises every job in art.js to a WebP data URL; tools/render-art.js saves them.
  async function render(job) {
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(job.svg);
    await img.decode();
    const c = document.createElement('canvas'); c.width = job.w; c.height = job.h;
    const x = c.getContext('2d');
    if (job.shadow) x.filter = job.shadow;
    x.drawImage(img, 0, 0, job.w, job.h);
    return c.toDataURL('image/webp', job.quality || 0.8);
  }
  (async () => {
    window.__out = {};
    for (const job of Art.jobs()) window.__out[job.name] = await render(job);
    window.__done = true;
  })().catch(e => { window.__err = String(e && e.stack || e); });
</script>
</body></html>
